<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="786" viewBox="0 0 1120 786" role="img" aria-labelledby="title desc">
<title id="title">改造一个功能时需要接通的五个位置</title><desc id="desc">沿资产、引用、代码、运行对象和生命周期检查一项修改。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M0,0 L0,8 L7,4 z" fill="#7aa6b2"/></marker></defs>
<rect width="1120" height="786" rx="18" fill="#112027"/>
<g font-family="Noto Sans SC,Microsoft YaHei,sans-serif">
<text x="42" y="48" fill="#f1f5f6" font-size="27" font-weight="700">改造一个功能时需要接通的五个位置</text>
<text x="42" y="80" fill="#9db4bd" font-size="17">关系示意图 · 按序号阅读 · 不是编辑器截图</text>
<rect x="42" y="110" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="142" r="18" fill="#b6d588"/>
<text x="78" y="149" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">1</text>
<text x="112" y="148" fill="#f1f5f6" font-size="23" font-weight="700">创建自己的对象</text>
<text x="112" y="178" fill="#d3e1e6" font-size="18">复制资产，保留父类、接口和需要的依赖。</text>
<path d="M560,211 V230" stroke="#7aa6b2" stroke-width="2" marker-end="url(#a)"/>
<rect x="42" y="238" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="270" r="18" fill="#b6d588"/>
<text x="78" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">2</text>
<text x="112" y="276" fill="#f1f5f6" font-size="23" font-weight="700">接上实际引用</text>
<text x="112" y="306" fill="#d3e1e6" font-size="18">在 Experience、PawnData 或 ActionSet 中选择副本。</text>
<path d="M560,339 V358" stroke="#7aa6b2" stroke-width="2" marker-end="url(#a)"/>
<rect x="42" y="366" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="398" r="18" fill="#b6d588"/>
<text x="78" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">3</text>
<text x="112" y="404" fill="#f1f5f6" font-size="23" font-weight="700">找到消费者</text>
<text x="112" y="434" fill="#d3e1e6" font-size="18">用 C++ 函数确认谁读取字段、何时生效、在哪一端执行。</text>
<path d="M560,467 V486" stroke="#7aa6b2" stroke-width="2" marker-end="url(#a)"/>
<rect x="42" y="494" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="526" r="18" fill="#b6d588"/>
<text x="78" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">4</text>
<text x="112" y="532" fill="#f1f5f6" font-size="23" font-weight="700">改变一个变量</text>
<text x="112" y="562" fill="#d3e1e6" font-size="18">记录原值与新值，编译保存，重新创建相关运行对象。</text>
<path d="M560,595 V614" stroke="#7aa6b2" stroke-width="2" marker-end="url(#a)"/>
<rect x="42" y="622" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="654" r="18" fill="#b6d588"/>
<text x="78" y="661" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">5</text>
<text x="112" y="660" fill="#f1f5f6" font-size="23" font-weight="700">验证与恢复</text>
<text x="112" y="690" fill="#d3e1e6" font-size="18">检查本地、服务器、退出和重生；恢复后保留对照记录。</text>
</g></svg>