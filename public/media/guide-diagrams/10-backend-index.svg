<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="658" viewBox="0 0 1120 658" role="img" aria-labelledby="title desc">
<title id="title">读一个 HTTP 请求的四个位置</title><desc id="desc">网络请求到达、SQL 成功提交、调用方收到响应是不同时间点。后续章节逐个解释这些环节。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M0,0 L0,8 L7,4 z" fill="#7aa6b2"/></marker></defs>
<rect width="1120" height="658" rx="18" fill="#112027"/>
<g font-family="Noto Sans SC,Microsoft YaHei,sans-serif">
<text x="42" y="48" fill="#f1f5f6" font-size="27" font-weight="700">读一个 HTTP 请求的四个位置</text>
<text x="42" y="80" fill="#9db4bd" font-size="17">关系示意图 · 按序号阅读 · 不是编辑器截图</text>
<rect x="42" y="110" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="142" r="18" fill="#b6d588"/>
<text x="78" y="149" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">1</text>
<text x="112" y="148" fill="#f1f5f6" font-size="23" font-weight="700">调用方构造请求</text>
<text x="112" y="178" fill="#d3e1e6" font-size="18">路径、方法、Authorization 头与 JSON；登录和游戏服保存使用不同身份。</text>
<path d="M560,211 V230" stroke="#7aa6b2" stroke-width="2" marker-end="url(#a)"/>
<rect x="42" y="238" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="270" r="18" fill="#b6d588"/>
<text x="78" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">2</text>
<text x="112" y="276" fill="#f1f5f6" font-size="23" font-weight="700">HTTPServer 接收并排队</text>
<text x="112" y="306" fill="#d3e1e6" font-size="18">检查请求体与队列容量，保留完成回调。</text>
<path d="M560,339 V358" stroke="#7aa6b2" stroke-width="2" marker-end="url(#a)"/>
<rect x="42" y="366" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="398" r="18" fill="#b6d588"/>
<text x="78" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">3</text>
<text x="112" y="404" fill="#f1f5f6" font-size="23" font-weight="700">Persistence 工作线程</text>
<text x="112" y="434" fill="#d3e1e6" font-size="18">检查权限和协议，执行参数化 SQL 与事务。</text>
<path d="M560,467 V486" stroke="#7aa6b2" stroke-width="2" marker-end="url(#a)"/>
<rect x="42" y="494" width="1036" height="100" rx="10" fill="#1d343e" stroke="#486571"/>
<circle cx="78" cy="526" r="18" fill="#b6d588"/>
<text x="78" y="533" text-anchor="middle" font-size="20" font-weight="700" fill="#142123">4</text>
<text x="112" y="532" fill="#f1f5f6" font-size="23" font-weight="700">主线程发送结果</text>
<text x="112" y="562" fill="#d3e1e6" font-size="18">把状态码与 JSON 回给调用方；调用方据此进入下一状态。</text>
</g></svg>